<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Management System (LMS)</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <div class="app-wrapper">
    <!-- Collapsible Sidebar Navigation -->
    <aside class="app-sidebar" id="app-shell-sidebar">
      <div class="sidebar-header">
        <div class="brand-logo-icon">📚</div>
        <span class="brand-text">Athenaeum LMS</span>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav-container" aria-label="Main Navigation">
        <!-- Dynamically injected role-aware navigation links -->
      </nav>

      <div class="sidebar-footer">
        <div style="font-size: 0.75rem; color: var(--text-muted);">
          <span>LMS v1.0 &bull; Secure</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn" title="Sign Out">Sign Out</button>
      </div>
    </aside>

    <!-- Main View Container -->
    <div class="app-main">
      <!-- Top Navigation Bar -->
      <header class="app-header" id="app-shell-header">
        <div class="header-left">
          <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle Navigation Sidebar">☰</button>
          <div class="header-search">
            <span class="header-search-icon">🔍</span>
            <input type="search" class="form-control" placeholder="Quick search catalog..." onkeydown="if(event.key==='Enter'){ window.location.hash='#/books?search='+encodeURIComponent(this.value); }" />
          </div>
        </div>

        <div class="header-right">
          <!-- Dark / Light Theme Toggle -->
          <button class="btn btn-ghost btn-icon" id="theme-toggle-btn" title="Toggle Theme" aria-label="Toggle Light and Dark Mode">🌙</button>

          <!-- Notification Bell with Popover -->
          <div class="notif-btn-wrap">
            <button class="btn btn-ghost btn-icon" id="notif-bell-btn" title="Notifications" aria-label="View In-App Notifications">
              🔔
              <span class="notif-badge-pill" id="notif-badge" style="display: none;">0</span>
            </button>

            <div class="notif-popover" id="notif-popover-box">
              <div class="notif-header">
                <span>Notifications</span>
                <button class="btn btn-ghost btn-sm" id="notif-mark-all-read" style="font-size: 0.7rem; padding: 2px 6px;">Mark all read</button>
              </div>
              <div class="notif-list" id="notif-list-items">
                <!-- Notifications injected here -->
              </div>
            </div>
          </div>

          <!-- User Profile & Role Indicator -->
          <div class="user-menu-btn" onclick="window.location.hash='#/profile'">
            <div class="user-avatar-circle" id="topbar-user-avatar">U</div>
            <div class="user-info-text">
              <span class="user-name-title" id="topbar-user-name">User</span>
              <span class="user-role-subtitle" id="topbar-user-role">Student</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Dynamic Content Landmark -->
      <main class="app-content" id="main-content" role="main">
        <!-- SPA views render here -->
      </main>
    </div>
  </div>

  <!-- Accessible Modal Root -->
  <div class="modal-backdrop" id="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal-dialog" id="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title">Dialog</h3>
        <button class="btn btn-ghost btn-icon" onclick="import('./js/components/modal.js').then(m => m.closeModal())" aria-label="Close Dialog">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Vanilla ES Module Entry Point -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
